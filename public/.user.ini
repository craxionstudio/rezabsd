; Raises PHP's own upload ceiling so real phone photos never get rejected
; before Laravel/Filament even sees them. Livewire's file upload endpoint
; sends the whole file in a single request (no chunking), so it's directly
; gated by these two php.ini directives — app code can't override them at
; runtime (ini_set() doesn't work for these), but PHP-FPM picks up
; .user.ini files per-directory automatically (no restart needed, just a
; short cache TTL) so this works without server/root access.
upload_max_filesize = 20M
post_max_size = 20M
